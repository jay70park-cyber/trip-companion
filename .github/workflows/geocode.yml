name: Geocode theme stops (helper)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          TMAP_KEY: ${{ secrets.TMAP_KEY }}
        run: node pipeline/geocode.mjs
