name: Record course narration

on:
  workflow_run:
    workflows: ["Build walking courses", "Publish story courses"]
    types: [completed]
  push:
    branches: [dev, main]
    paths: [pipeline/build-voice.mjs, pipeline/voice-lib.mjs]
  workflow_dispatch:
    inputs:
      courses:
        description: "Only these course ids (comma separated); empty = all"
        required: false
        default: ""
      voice:
        description: "Chirp 3: HD voice name, e.g. Charon, Aoede, Kore, Puck"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Open the data branch
        run: |
          git fetch --depth 1 origin data:data
          git worktree add out data
      - name: Record changed narration
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          COURSES: ${{ github.event.inputs.courses }}
          VOICE_NAME: ${{ github.event.inputs.voice || vars.VOICE_NAME || 'Charon' }}
        run: node pipeline/build-voice.mjs out
      - name: Publish to the data branch
        run: |
          cd out
          git add -A voice
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="K-Trip course bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update course narration $(date -u +%Y-%m-%d)"
          git push origin data
