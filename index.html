<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Trip Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d50">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K-Trip Companion">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: mobile single column — location, nearby list, then a guide panel that opens for the chosen place */
:root{
  --bg:#f3f1ec; --surface:#fffdf8; --ink:#22262b; --muted:#6b6f72; --line:#ddd8cc;
  --accent:#2f5d50; --accent-ink:#ffffff; --chip:#e7e3d8; --warn:#a4442a;
  --bus:#2b6cb0; --subway:#7b4bb0; --walk:#6b6f72;
  --display:"Gowun Batang",serif; --body:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15181b; --surface:#1e2226; --ink:#ebe8e1; --muted:#9aa0a4; --line:#30363b;
  --accent:#7fb8a5; --accent-ink:#0f1a16; --chip:#2a3035; --warn:#e48b6f;
  --bus:#7fb0e6; --subway:#c3a1ea; --walk:#9aa0a4; color-scheme:dark}}
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font:700 26px/1.25 var(--display);margin:2px 0 0;text-wrap:balance}
h2{font:700 18px/1.3 var(--display);margin:0 0 8px;text-wrap:balance}
h3{font:600 15px var(--body);margin:0 0 6px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;border-radius:0;background:transparent;color:var(--ink);padding:7px 11px;font:600 13px var(--body)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.live{background:var(--accent)} .dot.err{background:var(--warn)}
.coords{font:500 17px/1.35 var(--mono);font-variant-numeric:tabular-nums;margin:8px 0 2px;word-break:break-all}
.meta{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font:600 14px var(--body);padding:10px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
button.small,.btn.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input,select{width:100%;font:14px var(--mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{background:var(--chip);color:var(--ink);border-color:transparent;padding:7px 11px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:14px;margin-top:10px;color:var(--warn)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
ol.places{list-style:none;margin:0;padding:0}
ol.places>li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
ol.places>li:first-child{border-top:0}
.thumb{width:72px;height:72px;border-radius:6px;background:var(--chip);object-fit:cover;display:block}
.info{min-width:0}
.info .t{font-weight:600;line-height:1.35}
.info .a{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.info .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dist{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.count{font-size:13px;color:var(--muted);margin-bottom:6px}
details summary{cursor:pointer;font-size:14px;font-weight:600}
/* guide */
#guide{border-color:var(--accent)}
.consent{margin-top:12px;padding:12px;border:1px solid var(--accent);border-radius:8px;font-size:14px}
.consent p{margin:0;max-width:65ch}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding-top:4px}
.foot a{color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
ul.odii{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
ul.odii li{border:1px solid var(--line);border-radius:8px;padding:12px}
.odii-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
ul.odii audio{width:100%;margin-top:8px}
ul.odii details{margin-top:8px}
ul.odii details p{font-size:14px;line-height:1.7;max-width:65ch}
#map{height:min(60vh,380px);border-radius:8px;margin-top:12px;border:1px solid var(--line);z-index:0;background:var(--chip)}
.maptools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.maptools .meta{margin-left:auto}
.arrived{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.route{cursor:pointer}
.route.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.hero{width:100%;max-height:220px;object-fit:cover;border-radius:8px;display:block;margin-bottom:12px;background:var(--chip)}
.step{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.step-head{display:flex;gap:10px;align-items:baseline}
.num{font:500 12px var(--mono);color:var(--accent);flex:none}
.route{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.route-sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.route-sum b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.legs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.legs li{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:13px;align-items:start}
.mode{font:600 11px var(--body);letter-spacing:.04em;text-align:center;padding:3px 0;border-radius:4px;color:var(--surface)}
.mode.WALK{background:var(--walk)} .mode.BUS,.mode.EXPRESSBUS{background:var(--bus)} .mode.SUBWAY,.mode.TRAIN{background:var(--subway)}
.mode.other{background:var(--muted)}
.legs .sub{color:var(--muted)}
.overview{font-size:14px;line-height:1.7;max-width:65ch}
ol.turns{margin:8px 0 0;padding-left:20px;font-size:13px}
ol.turns li{margin:3px 0}
ul.food{list-style:none;margin:8px 0 0;padding:0}
ul.food li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
ul.food li:first-child{border-top:0}
.loading{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1>K-Trip Companion</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end">
    <button type="button" id="install" class="ghost small" hidden data-i="install"></button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-ko" aria-pressed="false">한국어</button>
    </div>
    </div>
  </div>

  <section class="card" aria-live="polite">
    <div class="status"><span class="dot" id="dot"></span><span id="state"></span></div>
    <div class="coords" id="coords">—</div>
    <div class="meta" id="acc"></div>
    <div class="row">
      <button type="button" id="gps" data-i="gps"></button>
    </div>
    <div class="grid" style="margin-top:10px">
      <div style="grid-column:1/-1">
        <label for="area" data-i="browse"></label>
        <select id="area"></select>
      </div>
    </div>
    <div class="consent" id="consent" hidden>
      <p id="consentText"></p>
      <div class="row" style="margin-top:8px">
        <button type="button" id="consentYes" data-i="agree"></button>
        <button type="button" id="consentNo" class="ghost" data-i="notNow"></button>
      </div>
    </div>
    <div class="msg" id="gpsmsg" hidden></div>
  </section>

  <section class="card">
    <h2 data-i="searchTitle"></h2>
    <div class="grid">
      <div>
        <label for="radius" data-i="radius"></label>
        <select id="radius">
          <option value="1000">1 km</option><option value="3000" selected>3 km</option>
          <option value="5000">5 km</option><option value="10000">10 km</option><option value="20000">20 km</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end">
        <button type="button" id="search" style="width:100%" data-i="search"></button>
      </div>
    </div>
    <div class="chips" id="chips" role="group"></div>
    <div class="msg" id="apimsg" hidden></div>
  </section>

  <section class="card" id="guide" hidden></section>

  <section class="card">
    <div class="count" id="count"></div>
    <ol class="places" id="list"></ol>
  </section>

  <section class="card" id="keysec">
    <details id="keybox">
      <summary data-i="keyTitle"></summary>
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:12px">
        <div><label for="key" data-i="keyLabel"></label><input id="key" type="password" autocomplete="off" spellcheck="false"></div>
        <div><label for="tkey" data-i="tkeyLabel"></label><input id="tkey" type="password" autocomplete="off" spellcheck="false"></div>
        <div><label for="nkey" data-i="nkeyLabel"></label><input id="nkey" type="text" autocomplete="off" spellcheck="false"></div>
        <div class="row" style="margin-top:0"><button type="button" id="savekey" data-i="save"></button></div>
        <p class="note" data-i="keyNote" style="margin:0"></p>
      </div>
    </details>
  </section>
  <footer class="foot">
    <a href="legal/privacy.html" data-i="privacy"></a>
    <a href="legal/terms.html" data-i="terms"></a>
    <a href="legal/location.html" data-i="locTerms"></a>
    <button type="button" id="withdraw" class="linkish" data-i="withdraw" hidden></button>
    <span class="meta" data-i="credits"></span>
  </footer>
</main>

  try{const r=await fetch("/api/config",{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&j.ok)SERVER=j;}}catch(e){}

const localKey=id=>(($(id)&&$(id).value)||"").replace(/[^\x21-\x7E]/g,"");
async function dataGo(service,op,extra){
  const key=localKey("key");
  if(!SERVER.tour&&!key)throw {api:t("needKey")};
  const p=new URLSearchParams({MobileOS:"ETC",MobileApp:"TripCompanion",_type:"json",...extra});
  let url;
  if(SERVER.ok){url="/api/tour/"+service+"/"+op+"?"+p+(!SERVER.tour?"&serviceKey="+encodeURIComponent(key):"");}
  else{url="https://apis.data.go.kr/B551011/"+service+"/"+op+"?serviceKey="+(key.includes("%")?key:encodeURIComponent(key))+"&"+p;}
  const res=await fetch(url);
  return parseDataGo(res);
}
async function parseDataGo(res){
  const text=await res.text();let data;
  try{data=JSON.parse(text)}catch(e){const m=text.match(/<returnAuthMsg>([^<]+)|<resultMsg>([^<]+)/);throw {api:(m&&(m[1]||m[2]))||("HTTP "+res.status)};}
  const h=data.response&&data.response.header;
  if(!h)throw {api:JSON.stringify(data).slice(0,160)};
  if(h.resultCode!=="0000")throw {api:h.resultMsg||h.resultCode};
  let it=data.response.body&&data.response.body.items&&data.response.body.items.item;
  return !it?[]:Array.isArray(it)?it:[it];
}
function tour(op,extra){return dataGo(SERVICE[lang],op,extra);}
async function search(){
  show("apimsg","");
  if(!SERVER.tour&&!localKey("key")){show("apimsg",t("needKey"));$("keybox").open=true;return;}
  const pos=areaPos();if(!pos){show("apimsg",t("needPos"));return;}
  $("count").textContent=t("loading");$("list").innerHTML="";$("search").disabled=true;
  const extra={numOfRows:"30",pageNo:"1",arrange:"E",mapX:String(pos.lng),mapY:String(pos.lat),radius:$("radius").value};
  const temple=cat==="temple";
  if(temple){extra.contentTypeId=lang==="en"?"76":"12";extra.numOfRows="200";}
  else if(cat)extra.contentTypeId=cat;
  try{
    let items=await tour("locationBasedList2",extra);
    if(temple)items=items.filter(isTemple);
    lastItems=items;renderList(lastItems);
  }
  catch(e){$("count").textContent="";show("apimsg",e&&e.api?t("apiErr")(e.api):t("netErr"));}
  finally{$("search").disabled=false;}
}
/* Temples: KTO classification (old cat3 A02010800 / new lclsSystm) when present, otherwise the name */
function isTemple(it){
  const codes=[it.cat3,it.lclsSystm3,it.lclsSystm2].filter(Boolean).join(" ");
  if(/A02010800/.test(codes))return true;
  const ttl=it.title||"";
  if(/\btemple\b|hermitage/i.test(ttl))return true;
  const ko=(ttl.match(/\(([^)]*[\uac00-\ud7a3][^)]*)\)\s*$/)||[,ttl])[1].trim();
  return /(사|암|사찰|선원)(\s*\([^)]*\))?$/.test(ko)&&!/(회사|대사관|공사|기념사|신문사|출판사|여행사|검사|조사)$/.test(ko);
}

  const i=el("img",cls);i.alt="";i.loading="lazy";i.src=src.replace(/^http:/,"https:");i.onerror=()=>i.removeAttribute("src");return i;

async function tmap(path,body){
  const k=localKey("tkey");
  if(!SERVER.tmap&&!k)throw {api:t("needT")};
  const url=(SERVER.ok?"/api/tmap":"https://apis.openapi.sk.com")+path;
  const headers={"Content-Type":"application/json",Accept:"application/json"};
  if(!SERVER.tmap)headers.appKey=k;
  let res;
  try{res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)});}
  catch(e){throw {api:t("cors")+" ["+(e&&e.message||e)+"]"};}
  const text=await res.text();let data;
  try{data=JSON.parse(text)}catch(e){throw {api:"HTTP "+res.status+" "+text.replace(/<[^>]+>/g," ").trim().slice(0,120)};}
  if(!res.ok){const m=(data.error&&(data.error.message||data.error.code))||(data.result&&data.result.message)||data.message||("HTTP "+res.status);throw {api:m+" (HTTP "+res.status+")"};}
  return data;
}
function busKind(kind,mode){
  const k=kind.toLowerCase();
  if(lang==="ko")return kind;
  if(mode==="SUBWAY"||mode==="TRAIN")return "";
  if(/town|village|마을/.test(k))return "Village bus";
  if(/airport|공항/.test(k))return "Airport bus";
  if(/express|wide|direct|광역|직행|좌석/.test(k))return "Express bus";
  return "Bus";
}
async function loadTransit(it,o,box){
  box.innerHTML="";box.append(el("div","loading",t("loading")));
  try{
    const d=await tmap("/transit/routes",{startX:String(o.lng),startY:String(o.lat),endX:String(it.mapx),endY:String(it.mapy),lang:lang==="en"?1:0,format:"json",count:3});
    box.innerHTML="";
    if(d.result&&d.result.status&&!(d.metaData)){box.append(el("div","meta",d.result.message||t("s1none")));return;}
    const its=(d.metaData&&d.metaData.plan&&d.metaData.plan.itineraries)||[];
    if(!its.length){box.append(el("div","meta",t("s1none")));return;}
    const cards=[];
    for(const r of its.slice(0,3)){
      const card=el("div","route");cards.push(card);
      card.onclick=()=>{cards.forEach(c=>c.classList.remove("sel"));card.classList.add("sel");drawItinerary(r);};const sum=el("div","route-sum");
      const tot=el("span");tot.append(el("b",null,Math.round(r.totalTime/60)+" "+t("min")));sum.append(tot);
      sum.append(el("span",null,t("transfers")(r.transferCount||0)));
      sum.append(el("span",null,t("walk")+" "+fmtD(r.totalWalkDistance||0)));
      const fare=r.fare&&r.fare.regular&&r.fare.regular.totalFare;
      if(fare!=null)sum.append(el("span",null,t("fare")+" ₩"+Number(fare).toLocaleString()));
      card.append(sum);
      const ul=el("ul","legs");
      const legs=r.legs||[];
      legs.forEach((leg,i)=>{
        const li=el("li");const mk=(leg.mode||"").replace(/\s+/g,"");const md=T[lang].modes[mk]?mk:"other";
        const txt=el("div");
        const endName=n=>(!n||/^(도착지|목적지)$/.test(n))?(it.title||"").replace(/\s*\([^)]*[\uac00-\ud7a3][^)]*\)\s*$/,"")||t("dest"):n;
        const startName=n=>(!n||/^출발지$/.test(n))?t("start"):n;
        if(mk==="WALK"){
          if((leg.distance||0)<30&&i>0&&i<legs.length-1){
            li.append(el("span","mode WALK","↻"));txt.append(el("div",null,t("sameStop")));li.append(txt);ul.append(li);return;
          }
          li.append(el("span","mode WALK",T[lang].modes.WALK));
          txt.append(el("div",null,fmtD(leg.distance||0)+" → "+endName(leg.end&&leg.end.name)));
        }else{
          const chip=el("span","mode "+md,T[lang].modes[mk]||leg.mode);
          if(leg.routeColor&&/^[0-9a-f]{6}$/i.test(leg.routeColor))chip.style.background="#"+leg.routeColor;
          li.append(chip);
          const parts=String(leg.route||"").split(":");
          const kind=parts.length>1?parts[0].trim():"";const num=parts.length>1?parts.slice(1).join(":").trim():String(leg.route||"");
          const kindLabel=busKind(kind,mk);
          const line=el("div");const b=el("b",null,(kindLabel?kindLabel+" ":"")+num);line.append(b);
          txt.append(line);
          txt.append(el("div",null,t("board")+" "+startName(leg.start&&leg.start.name)+" → "+t("alight")+" "+endName(leg.end&&leg.end.name)));
        }
        const sl=leg.passStopList&&(leg.passStopList.stationList||leg.passStopList.stations);const n=sl?sl.length-1:null;
        txt.append(el("div","sub",Math.round((leg.sectionTime||0)/60)+" "+t("min")+(n>0?" · "+t("stops")(n):"")));
        li.append(txt);ul.append(li);
      });
      card.append(ul);box.append(card);
    }
    if(cards[0]){cards[0].classList.add("sel");drawItinerary(its[0]);}
    box.prepend(el("div","meta",t("tapRoute")));
  }catch(e){box.innerHTML="";box.append(el("div","msg",e&&e.api?t("apiErr")(e.api):t("netErr")));}
}

    box.innerHTML="";
    const f=d.features||[];const p0=f[0]&&f[0].properties;
    if(p0&&p0.totalDistance!=null)box.append(el("div","meta",fmtD(p0.totalDistance)+" · "+Math.round(p0.totalTime/60)+" "+t("min")));
    const ol=el("ol","turns");
    for(const x of f){if(x.geometry&&x.geometry.type==="Point"&&x.properties&&x.properties.description)ol.append(el("li",null,x.properties.description));}
    box.append(ol);
    drawWalk(f);
  }catch(e){box.innerHTML="";box.append(el("div","msg",e&&e.api?t("apiErr")(e.api):t("netErr")));}
}

/* ---------- Map (Naver Maps when a Client ID is set, OpenStreetMap otherwise) ---------- */
let map=null,engine=null,routeObjs=[],meDot=null,meAcc=null,follow=false,arrivedFor=null,destLL=null,originLL=null,fixedObjs=[];
let naverReady=null,naverFailed=false;
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setFollow(v){follow=v;const b=$("followBtn");if(b){b.textContent=v?t("followOff"):t("followOn");b.className=v?"small":"ghost small";}}
function loadNaver(){
  const id=(SERVER.naver||store.get("naver_key")||"").replace(/[^\x21-\x7E]/g,"");
  if(!id||naverFailed)return Promise.resolve(false);
  if(naverReady)return naverReady;
  naverReady=new Promise(res=>{
    window.navermap_authFailure=()=>{naverFailed=true;showMapNote(t("naverFail"));if(engine==="naver"&&current){initMap(current,originLL?{lat:originLL[0],lng:originLL[1]}:origin());}};
    const sc=document.createElement("script");
    sc.src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId="+encodeURIComponent(id)+"&language="+(lang==="en"?"en":"ko");
    sc.onload=()=>res(!!(window.naver&&window.naver.maps));sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
  return naverReady;
}
function showMapNote(msg){const n=$("mapnote");if(n)n.textContent=msg;}
const N=(p)=>new naver.maps.LatLng(p[0],p[1]);
function clearRoute(){
  for(const o of routeObjs){engine==="naver"?o.setMap(null):o.remove();}
  routeObjs=[];
}
function addLine(pts,opt){
  if(pts.length<2||!map)return;
  if(engine==="naver"){
    routeObjs.push(new naver.maps.Polyline({map,path:pts.map(N),strokeColor:opt.color,strokeWeight:opt.weight,strokeOpacity:opt.opacity||1,strokeStyle:opt.dash?"shortdash":"solid",strokeLineCap:"round",strokeLineJoin:"round"}));
  }else{
    routeObjs.push(L.polyline(pts,{color:opt.color,weight:opt.weight,opacity:opt.opacity||1,dashArray:opt.dash?"6 8":null}).addTo(map));
  }
}
function dotHtml(fill,size){return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+fill+';border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transform:translate(-50%,-50%)"></div>';}
function addDot(ll,fill,size,title){
  if(engine==="naver"){
    return new naver.maps.Marker({map,position:N(ll),title:title||"",icon:{content:dotHtml(fill,size),anchor:new naver.maps.Point(0,0)}});
  }
  const m=L.circleMarker(ll,{radius:size/2,color:"#fff",weight:3,fillColor:fill,fillOpacity:1}).addTo(map);
  if(title)m.bindTooltip(title,{direction:"top"});
  return m;
}
async function initMap(it,o){
  if(map){try{engine==="naver"?map.destroy():map.remove();}catch(e){}map=null;}
  meDot=null;meAcc=null;routeObjs=[];fixedObjs=[];arrivedFor=null;
  destLL=[+it.mapy,+it.mapx];originLL=[o.lat,o.lng];
  const box=$("map");if(!box)return;box.innerHTML="";
  const useNaver=await loadNaver();
  if(current!==it)return;
  if(useNaver&&!naverFailed){
    engine="naver";
    map=new naver.maps.Map(box,{center:N(destLL),zoom:15,mapDataControl:false,scaleControl:false,logoControlOptions:{position:naver.maps.Position.BOTTOM_LEFT}});
    naver.maps.Event.addListener(map,"dragstart",()=>setFollow(false));
    showMapNote("NAVER Map");
  }else if(window.L){
    engine="leaflet";
    map=L.map(box,{zoomControl:true,attributionControl:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    map.on("dragstart",()=>setFollow(false));
    if(!naverFailed)showMapNote("© OpenStreetMap");
    setTimeout(()=>map&&map.invalidateSize(),300);
  }else{box.textContent="Map library failed to load.";return;}
  fixedObjs.push(addDot(destLL,cssVar("--warn"),18,it.title));
  fixedObjs.push(addDot(originLL,cssVar("--muted"),12));
  setFollow(false);fitAll();
  if(gpsPos)updateMe(gpsPos,null);
}
let routePts=[];
function fitAll(){
  if(!map)return;
  const pts=[destLL,originLL,...routePts];if(gpsPos)pts.push([gpsPos.lat,gpsPos.lng]);
  let s=90,w=180,n=-90,e=-180;for(const p of pts){s=Math.min(s,p[0]);n=Math.max(n,p[0]);w=Math.min(w,p[1]);e=Math.max(e,p[1]);}
  if(engine==="naver"){map.fitBounds(new naver.maps.LatLngBounds(N([s,w]),N([n,e])),{top:30,right:30,bottom:30,left:30});if(map.getZoom()>17)map.setZoom(17);}
  else map.fitBounds([[s,w],[n,e]],{padding:[30,30],maxZoom:17});
}
function parseLine(ls){
  if(!ls)return [];
  return String(ls).trim().split(/\s+/).map(pt=>{const [x,y]=pt.split(",").map(Number);return [y,x];}).filter(a=>isFinite(a[0])&&isFinite(a[1]));
}
function drawItinerary(r){
  if(!map)return;clearRoute();routePts=[];
  for(const leg of r.legs||[]){
    const mk=(leg.mode||"").replace(/\s+/g,"");
    if(mk==="WALK"){
      const pts=(leg.steps||[]).flatMap(st=>parseLine(st.linestring));
      addLine(pts,{color:cssVar("--walk"),weight:4,dash:true});routePts.push(...pts);
    }else{
      const pts=parseLine(leg.passShape&&leg.passShape.linestring);
      const col=leg.routeColor&&/^[0-9a-f]{6}$/i.test(leg.routeColor)?"#"+leg.routeColor:cssVar(mk==="SUBWAY"||mk==="TRAIN"?"--subway":"--bus");
      addLine(pts,{color:col,weight:6,opacity:.9});routePts.push(...pts);
    }
  }
  setFollow(false);fitAll();
}
function drawWalk(features){
  if(!map)return;clearRoute();routePts=[];
  const pts=[];
  for(const x of features){if(x.geometry&&x.geometry.type==="LineString")for(const c of x.geometry.coordinates)pts.push([c[1],c[0]]);}
  addLine(pts,{color:cssVar("--accent"),weight:6});routePts=pts;
  fitAll();
}
function updateMe(pos,acc){
  if(map){
    const ll=[pos.lat,pos.lng];
    if(engine==="naver"){
      if(!meDot){
        meAcc=new naver.maps.Circle({map,center:N(ll),radius:acc||20,strokeColor:cssVar("--accent"),strokeWeight:1,fillColor:cssVar("--accent"),fillOpacity:.12});
        meDot=addDot(ll,cssVar("--accent"),16);
      }else{meDot.setPosition(N(ll));meAcc.setCenter(N(ll));if(acc)meAcc.setRadius(acc);}
      if(follow)map.panTo(N(ll));
    }else{
      if(!meDot){
        meAcc=L.circle(ll,{radius:acc||20,color:cssVar("--accent"),weight:1,fillOpacity:.12}).addTo(map);
        meDot=addDot(ll,cssVar("--accent"),16);
      }else{meDot.setLatLng(ll);meAcc.setLatLng(ll);if(acc)meAcc.setRadius(acc);}
      if(follow)map.panTo(ll,{animate:!matchMedia("(prefers-reduced-motion: reduce)").matches});
    }
  }
  if(current&&destLL){
    const d=meters(pos.lat,pos.lng,destLL[0],destLL[1]);
    const box=$("arrived");
    if(box&&d<=ARRIVE_M&&arrivedFor!==current.contentid){
      arrivedFor=current.contentid;
      box.innerHTML="";box.append(el("div",null,t("arrived")((current.title||"").replace(/\s*\([^)]*[\uac00-\ud7a3][^)]*\)\s*$/,""))));box.hidden=false;
      const au=document.querySelector("ul.odii audio");
      if(au){const pb=el("button","small",t("playGuide"));pb.type="button";pb.style.marginTop="8px";pb.style.background="var(--accent-ink)";pb.style.color="var(--accent)";
        pb.onclick=()=>{au.closest("li").scrollIntoView({behavior:"smooth",block:"center"});au.play().catch(()=>{});};box.append(pb);}
      try{navigator.vibrate&&navigator.vibrate([150,80,150]);}catch(e){}
    }
  }
}
const ARRIVE_M=50;

/* ---------- App install (PWA) ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("install").hidden=false;});
window.addEventListener("appinstalled",()=>{$("install").hidden=true;installEvt=null;});
$("install").onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;$("install").hidden=true;};
if("serviceWorker" in navigator&&window.isSecureContext){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}

(async()=>{
  try{const q=new URLSearchParams(location.search).get("cat");if(q)cat=q;}catch(e){}
  await loadConfig();
  const allOnServer=SERVER.tour&&SERVER.tmap;
  $("keysec").hidden=allOnServer;
  if(!allOnServer&&(!localKey("key")||!localKey("tkey")))$("keybox").open=true;
  applyLang();
  search();
})();
</script>
